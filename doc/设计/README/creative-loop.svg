<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="704" viewBox="0 0 1280 704" role="img" aria-labelledby="title desc">
<title id="title">从选句到交付的创作循环</title><desc id="desc">选句立意、组织分镜、图片试作、视频与声音、制作交付、方法沉淀。作品素材与可复用经验分别沉淀，人工决定采用。</desc>
<rect x="0" y="0" width="1280" height="704" rx="0" fill="#192723" stroke="none"/><text x="44" y="48" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="500" fill="#93CFB5" letter-spacing="2">02  /  THE CREATIVE LOOP</text><text x="44" y="105" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="36" font-weight="500" fill="#F5F3EC" >一次作品，两种产出。</text><text x="45" y="146" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#A0B5AA" >交付这一期素材，也积累下一期的创作依据。</text><text x="46" y="211" font-family="'Menlo',monospace" font-size="18" font-weight="500" fill="#93CFB5" >01</text><path d="M44 233 h182" fill="none" stroke="#526B5D" stroke-width="2" /><text x="44" y="275" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="500" fill="#F5F3EC" >选句立意</text><text x="44" y="317" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="400" fill="#A0B5AA" >原文与语境</text><text x="44" y="350" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#A0B5AA" >明确本片表达</text><path d="M229 233 h12 m-5 -4 l5 4 -5 4" fill="none" stroke="#93CFB5" stroke-width="1.5" /><text x="246" y="211" font-family="'Menlo',monospace" font-size="18" font-weight="500" fill="#93CFB5" >02</text><path d="M244 233 h182" fill="none" stroke="#526B5D" stroke-width="2" /><text x="244" y="275" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="500" fill="#F5F3EC" >组织分镜</text><text x="244" y="317" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="400" fill="#A0B5AA" >段落与节奏</text><text x="244" y="350" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#A0B5AA" >一段诗可以有多镜</text><path d="M429 233 h12 m-5 -4 l5 4 -5 4" fill="none" stroke="#93CFB5" stroke-width="1.5" /><text x="446" y="211" font-family="'Menlo',monospace" font-size="18" font-weight="500" fill="#93CFB5" >03</text><path d="M444 233 h182" fill="none" stroke="#526B5D" stroke-width="2" /><text x="444" y="275" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="500" fill="#F5F3EC" >图片试作</text><text x="444" y="317" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="400" fill="#A0B5AA" >实际输入与参考</text><text x="444" y="350" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#A0B5AA" >审图后修改</text><path d="M629 233 h12 m-5 -4 l5 4 -5 4" fill="none" stroke="#93CFB5" stroke-width="1.5" /><text x="646" y="211" font-family="'Menlo',monospace" font-size="18" font-weight="500" fill="#93CFB5" >04</text><path d="M644 233 h182" fill="none" stroke="#526B5D" stroke-width="2" /><text x="644" y="275" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="500" fill="#F5F3EC" >视频与声音</text><text x="644" y="317" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="400" fill="#A0B5AA" >基于已采用图片</text><text x="644" y="350" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#A0B5AA" >生成后继续审阅</text><path d="M829 233 h12 m-5 -4 l5 4 -5 4" fill="none" stroke="#93CFB5" stroke-width="1.5" /><text x="846" y="211" font-family="'Menlo',monospace" font-size="18" font-weight="500" fill="#93CFB5" >05</text><path d="M844 233 h182" fill="none" stroke="#526B5D" stroke-width="2" /><text x="844" y="275" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="500" fill="#F5F3EC" >制作交付</text><text x="844" y="317" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="400" fill="#A0B5AA" >镜头与素材对应</text><text x="844" y="350" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#A0B5AA" >交给剪辑师</text><path d="M1029 233 h12 m-5 -4 l5 4 -5 4" fill="none" stroke="#93CFB5" stroke-width="1.5" /><text x="1046" y="211" font-family="'Menlo',monospace" font-size="18" font-weight="500" fill="#93CFB5" >06</text><path d="M1044 233 h182" fill="none" stroke="#526B5D" stroke-width="2" /><text x="1044" y="275" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="500" fill="#F5F3EC" >方法沉淀</text><text x="1044" y="317" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="400" fill="#A0B5AA" >结果、条件、反馈</text><text x="1044" y="350" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#A0B5AA" >有效经验再复用</text><path d="M533 380 V407 H733 V380" fill="none" stroke="#93CFB5" stroke-width="1.5" /><rect x="529" y="405" width="212" height="36" rx="0" fill="#2A4535" stroke="none"/><text x="548" y="430" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="500" fill="#93CFB5" >逐镜判断，用户采用</text><rect x="44" y="480" width="566" height="121" rx="0" fill="#23372D" stroke="#3B5545"/><text x="68" y="515" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#93CFB5" letter-spacing="2">OUTPUT A</text><text x="68" y="556" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="500" fill="#F5F3EC" >作品素材</text><text x="255" y="557" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="400" fill="#A0B5AA" >图片 / 视频 / 声音 / 交接</text><rect x="632" y="480" width="604" height="121" rx="0" fill="#23372D" stroke="#3B5545"/><text x="656" y="515" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#93CFB5" letter-spacing="2">OUTPUT B</text><text x="656" y="556" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="500" fill="#F5F3EC" >可复用经验</text><text x="852" y="557" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="400" fill="#A0B5AA" >方法 / 条件 / 结果 / 反馈</text><path d="M934 604 V641 H28 V374 H133" fill="none" stroke="#93CFB5" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M124 369 l9 5 -9 5" fill="none" stroke="#93CFB5" stroke-width="1.5" /><rect x="422" y="624" width="404" height="35" rx="0" fill="#192723" stroke="none"/><text x="449" y="649" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#93CFB5" >带着有效经验，回到下一次创作</text><text x="44" y="687" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#A0B5AA" >流程约定：候选 ≠ 采用；采用 ≠ 已验证可复用。</text>
</svg>
