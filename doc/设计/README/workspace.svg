<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
<title id="title">FilmOS协作架构</title><desc id="desc">三部分：知识与资产、创作与决策、生成与后期。结果与反馈回到本地。看板不直连模型，人工负责采用。</desc>
<rect x="0" y="0" width="1280" height="620" rx="0" fill="#F5F3EC" stroke="none"/><text x="44" y="48" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="500" fill="#68746D" letter-spacing="2">01  /  THE WORKSPACE</text><text x="43" y="103" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="36" font-weight="500" fill="#192723" >一个工作区，三种分工。</text><text x="45" y="142" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#68746D" >资料提供依据，创作者做出判断，工具完成执行。</text><rect x="44" y="190" width="370" height="255" rx="0" fill="#FCFBF7" stroke="#D5DBD2"/><rect x="44" y="190" width="370" height="4" rx="0" fill="#192723" stroke="none"/><text x="68" y="229" font-family="'Menlo',monospace" font-size="18" font-weight="500" fill="#68746D" >A</text><text x="68" y="283" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="31" font-weight="500" fill="#192723" >知识与资产</text><text x="68" y="329" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#192723" >原文 · 出处 · 意境</text><text x="68" y="366" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#68746D" >脚本 · 完整输入 · 实际素材</text><text x="68" y="417" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#68746D" >doc/   /   Git + LFS</text><rect x="455" y="190" width="370" height="255" rx="0" fill="#FCFBF7" stroke="#D5DBD2"/><rect x="455" y="190" width="370" height="4" rx="0" fill="#438469" stroke="none"/><text x="479" y="229" font-family="'Menlo',monospace" font-size="18" font-weight="500" fill="#68746D" >B</text><text x="479" y="283" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="31" font-weight="500" fill="#192723" >创作与决策</text><text x="479" y="329" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#192723" >选句 · 立意 · 逐镜审阅</text><text x="479" y="366" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#68746D" >创作者 + Codex 协作</text><text x="479" y="417" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#68746D" >采用决定由人做出</text><rect x="866" y="190" width="370" height="255" rx="0" fill="#FCFBF7" stroke="#D5DBD2"/><rect x="866" y="190" width="370" height="4" rx="0" fill="#192723" stroke="none"/><text x="890" y="229" font-family="'Menlo',monospace" font-size="18" font-weight="500" fill="#68746D" >C</text><text x="890" y="283" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="31" font-weight="500" fill="#192723" >生成与后期</text><text x="890" y="329" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#192723" >图片 · 视频 · 音色试作</text><text x="890" y="366" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#68746D" >外部模型 / 平台 · 剪辑</text><text x="890" y="417" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#68746D" >结果与参数回到本地</text><path d="M419 312 h30 m-7 -5 l7 5 -7 5" fill="none" stroke="#438469" stroke-width="2" /><path d="M830 312 h30 m-7 -5 l7 5 -7 5" fill="none" stroke="#438469" stroke-width="2" /><path d="M1051 446 V485 H229 V446" fill="none" stroke="#438469" stroke-width="2" /><rect x="490" y="468" width="302" height="34" rx="0" fill="#F5F3EC" stroke="none"/><text x="511" y="492" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="500" fill="#32694F" >保存实际结果与审阅反馈</text><path d="M224 453 l5 -7 5 7" fill="none" stroke="#438469" stroke-width="2" /><rect x="44" y="533" width="1192" height="48" rx="0" fill="#E8EBE2" stroke="none"/><text x="65" y="564" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#68746D" >本地看板负责检索、组期与记录；图中是协作分工，不表示已实现模型直连或自动流水线。</text>
